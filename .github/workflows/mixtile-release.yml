name: Build Mixtile firmware

on:
  workflow_dispatch:
    inputs:
      series:
        description: OpenWrt stable series to build
        required: true
        type: choice
        options:
          - "24.10"
          - "25.12"
      board:
        description: Mixtile board to build
        required: true
        type: choice
        options:
          - "all"
          - "edge2"
          - "blade3"
      ref:
        description: Optional git ref to build
        required: false
        type: string
      publish_release:
        description: Create a draft GitHub release when building a tag
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "mixtile-v24.10.*"
      - "mixtile-v25.12.*"

permissions:
  contents: write

concurrency:
  group: mixtile-release-${{ github.event.inputs.ref || github.event.inputs.series || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      board: ${{ steps.meta.outputs.board }}
      boards: ${{ steps.meta.outputs.boards }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      ref: ${{ steps.meta.outputs.ref }}
      series: ${{ steps.meta.outputs.series }}
      tag: ${{ steps.meta.outputs.tag }}
      upstream_baseline: ${{ steps.meta.outputs.upstream_baseline }}

    steps:
      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            ref="${GITHUB_REF}"
            tag="${GITHUB_REF_NAME}"
            board="all"

            case "${tag}" in
              mixtile-v24.10.*) series="24.10" ;;
              mixtile-v25.12.*) series="25.12" ;;
              *)
                echo "::error::Unsupported Mixtile tag: ${tag}"
                exit 1
                ;;
            esac

            publish_release=true
          else
            series="${{ inputs.series }}"
            board="${{ inputs.board }}"
            ref="${{ inputs.ref }}"
            publish_release="${{ inputs.publish_release }}"
            tag=""

            if [[ -z "${ref}" ]]; then
              ref="openwrt-${series}"
            elif [[ "${ref}" == refs/tags/* ]]; then
              tag="${ref#refs/tags/}"
            elif [[ "${ref}" == mixtile-v* ]]; then
              tag="${ref}"
            fi
          fi

          if [[ "${board}" == "all" ]]; then
            boards='["edge2","blade3"]'
          else
            boards="[\"${board}\"]"
          fi

          upstream_baseline="openwrt-${series}"
          if [[ -n "${tag}" ]]; then
            maybe_baseline="$(echo "${tag}" | sed -E 's/^mixtile-v([0-9]+\.[0-9]+\.[0-9]+)(-r[0-9]+)?$/v\1/')"
            if [[ "${maybe_baseline}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              upstream_baseline="${maybe_baseline}"
            fi
          fi

          echo "board=${board}" >> "${GITHUB_OUTPUT}"
          echo "boards=${boards}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${publish_release}" >> "${GITHUB_OUTPUT}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "series=${series}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "upstream_baseline=${upstream_baseline}" >> "${GITHUB_OUTPUT}"

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.meta.outputs.boards) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.meta.outputs.ref }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            file \
            flex \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            wget \
            zlib1g-dev

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: ${{ runner.os }}-${{ needs.meta.outputs.series }}-${{ matrix.board }}-${{ hashFiles('configs/mixtile-*.config', 'feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-${{ needs.meta.outputs.series }}-${{ matrix.board }}-
            ${{ runner.os }}-${{ needs.meta.outputs.series }}-

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        shell: bash
        run: |
          set -euo pipefail
          cat "configs/mixtile-${{ matrix.board }}-${{ needs.meta.outputs.series }}.config" > .config
          printf '%s\n' 'CONFIG_CCACHE=y' >> .config
          # Enable all kmod packages
          sed -i '/^# CONFIG_PACKAGE_kmod/d' .config
          grep -q 'CONFIG_ALL_KMODS=y' .config || printf '%s\n' 'CONFIG_ALL_KMODS=y' >> .config
          make defconfig
          KMOD_M=$(grep -c 'CONFIG_PACKAGE_kmod.*=m' .config || true)
          echo "kmod packages (module): ${KMOD_M}"

      - name: Pre-configure kmod feed in firmware
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="${{ needs.meta.outputs.upstream_baseline }}"
          if [[ "${BASELINE}" == v* ]]; then
            VERSION="${BASELINE#v}"
          else
            VERSION="$(grep 'VERSION_NUMBER' include/version.mk | sed -n 's/.*VERSION_NUMBER[[:space:]]*[:?]*=[[:space:]]*\([^#]*\)/\1/p' | tr -d ' "' | head -1)"
          fi
          echo "Embedding kmod feed for version: ${VERSION}"
          mkdir -p target/linux/rockchip/armv8/base-files/etc/opkg
          cat > target/linux/rockchip/armv8/base-files/etc/opkg/customfeeds.conf << FEED
          src/gz mixtile_kmod https://mixtile-rockchip.github.io/openwrt/releases/${VERSION}/targets/rockchip/armv8/packages
          FEED
          cat target/linux/rockchip/armv8/base-files/etc/opkg/customfeeds.conf

      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          make download -j"$(nproc)"

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" BUILD_LOG=1

      - name: Collect release assets
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          target_dir="bin/targets/rockchip/armv8"
          mkdir -p release-assets

          # Firmware images only (GitHub Release provides built-in SHA256 verification)
          find "${target_dir}" -maxdepth 1 -type f -name "*.img.gz" -exec cp {} release-assets/ \;

      - name: Upload release assets
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: mixtile-${{ needs.meta.outputs.series }}-${{ matrix.board }}-firmware
          path: release-assets/
          if-no-files-found: error

      - name: Upload kmod packages
        if: ${{ success() && matrix.board == 'edge2' }}
        uses: actions/upload-artifact@v4
        with:
          name: kmod-packages
          path: bin/targets/rockchip/armv8/packages/
          if-no-files-found: warn

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mixtile-${{ needs.meta.outputs.series }}-${{ matrix.board }}-logs
          path: logs/
          if-no-files-found: warn

  publish-pages:
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    if: ${{ needs.meta.outputs.publish_release == 'true' }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mixtile-${{ needs.meta.outputs.series }}-*-firmware
          merge-multiple: true
          path: staging-firmware/

      - name: Download kmod packages
        uses: actions/download-artifact@v4
        with:
          name: kmod-packages
          path: staging-kmod/

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="${{ needs.meta.outputs.upstream_baseline }}"
          VERSION="${BASELINE#v}"

          # Mirror upstream structure:
          #   releases/{VERSION}/targets/rockchip/armv8/           ← firmware + sha256sums
          #   releases/{VERSION}/targets/rockchip/armv8/packages/  ← kmod packages
          TARGET_DIR="releases/${VERSION}/targets/rockchip/armv8"
          PKG_DIR="${TARGET_DIR}/packages"

          mkdir -p "${TARGET_DIR}"
          mkdir -p "${PKG_DIR}"

          # Firmware images
          find staging-firmware/ -name '*.img.gz' -exec cp {} "${TARGET_DIR}/" \;

          # Generate combined sha256sums (mirrors upstream structure)
          (cd "${TARGET_DIR}" && sha256sum *.img.gz > sha256sums)

          # kmod packages (edge2 and blade3 share the same target, one set is enough)
          rsync -a --delete staging-kmod/ "${PKG_DIR}/"

          # Clean up all staging directories and any legacy artifacts
          rm -rf staging-firmware/ staging-kmod/ kmod-temp/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add ${VERSION} firmware and kmod packages"
          git push

  release:
    needs:
      - meta
      - build
      - publish-pages
    runs-on: ubuntu-latest
    if: ${{ needs.meta.outputs.publish_release == 'true' }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: mixtile-${{ needs.meta.outputs.series }}-*-firmware
          merge-multiple: true
          path: release-assets/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Mixtile OpenWrt ${{ needs.meta.outputs.tag }}
          draft: true
          prerelease: false
          body: |
            Upstream baseline: `${{ needs.meta.outputs.upstream_baseline }}`

            Supported devices:
            - Mixtile Edge 2
            - Mixtile Blade 3

            Firmware types:
            - `ext4`: writable filesystem, for development
            - `squashfs`: read-only with overlay, for production (supports factory reset)

            kmod packages:
            Kernel modules are pre-configured in the firmware. Just run:
            ```
            opkg update
            opkg install kmod-xxx
            ```
          files: |
            release-assets/*
